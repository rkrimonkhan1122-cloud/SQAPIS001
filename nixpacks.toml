# Nixpacks config — Railway reads this automatically on every git push.
# This ensures auto-deploy works without any manual Railway dashboard settings.
[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 4 --timeout-keep-alive 60 --no-access-log"

[variables]
PATH = "/opt/venv/bin:$PATH"
PYTHONUNBUFFERED = "1"
MAX_CONCURRENT_CHECKS = "2000"
THREAD_POOL_SIZE = "2000"
